# Gateway DAIS : point d'entrée unique de l'application
#   RTMP  :1935 -> server:1935
#   HTTP  :80   /hls/ -> server:8080 ; / -> web:80
# Les noms "server" et "web" sont résolus au démarrage de nginx :
#   - dans Compose, ce sont les noms des services ;
#   - dans Kubernetes, ce sont les noms des Services (même namespace).
# Si un nom n'est pas résolu, nginx refuse de démarrer.
include /etc/nginx/modules-enabled/*.conf;   # charge ngx_stream_module

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

stream {
    server {
        listen 1935;
        proxy_pass server:1935;
        proxy_timeout 1h;
    }
}

http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;

    server {
        listen 80;

        # TP1 4.2 : ajoutez ici un en-tête, par exemple
        # add_header X-DAIS-Gateway "configmap" always;

        location /hls/ {
            proxy_pass http://server:8080;
            proxy_buffering off;
        }

        location / {
            proxy_pass http://web:80;
        }
    }
}
